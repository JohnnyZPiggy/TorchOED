name: CPU CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . mkdocs==1.6.1
      - run: mkdocs build --strict
      - run: python tools/run_doc_snippets.py
      - run: python -c 'from pathlib import Path; import torchoed; text=Path("website/api.md").read_text(); assert all("`"+name+"(" in text for name in torchoed.__all__); print("API coverage 18/18 PASS")'
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - if: runner.os == 'macOS'
        run: python -m pip install torch
      - run: python -m pip install -e ".[test]"
      - run: python -c "import torch; print(torch.__version__)"
      - run: pytest -q
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python -m pip install pyright==1.1.407
          pyright --verifytypes torchoed --ignoreexternal
  min-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "torch==2.2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test]"
      - run: python -c "import torch,sys; print(torch.__version__); sys.exit(torch.__version__.split('+')[0] != '2.2.0')"
      - run: pytest -q
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install build
          python -m build --wheel
          python -c "import glob,zipfile; assert 'torchoed/py.typed' in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import torch; print(torch.__version__)"
          cp -r examples "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" examples/cpu_quickstart.py
