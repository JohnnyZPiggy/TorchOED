[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torchoed"
version = "0.6.0"
description = "PyTorch-native optimal experimental design: D/A/I exchange with certified efficiency floors"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.2"]

[project.urls]
Homepage = "https://johnnyzpiggy.github.io/TorchOED/"
Documentation = "https://johnnyzpiggy.github.io/TorchOED/"
Source = "https://github.com/JohnnyZPiggy/TorchOED"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
