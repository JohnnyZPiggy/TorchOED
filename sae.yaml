sae_version: "3.4"
project:
  repository: "JohnnyZPiggy/TorchOED"
  name: "TorchOED"
  package: "torchoed"
  scientific_goal: "PyTorch-native DOE/OED with explicit numerical contracts"
framework:
  repository: "JohnnyZPiggy/SAE-Framework"
  commit_sha: "5fb26304e4c85183aa215e6ad4db9ced928cab12"
  adoption: "minimal_reference"
  entrypoint: ".sae/README.md"
roles:
  scientist: "human"
  architect: "assigned_architect"
  mentor: "assigned_scientific_mentor"
  engineer: "codex"
collaboration:
  task_hub: "github_issues"
  review_hub: "github_pull_requests"
  actions_enabled: false
  hosted_ci_required: false
  engineer_may_merge: false
simplicity:
  contract: "governance/SIMPLICITY_CONTRACT.md"
  dispatch_requires: ["definition_of_done", "size_budget", "required_tests", "not_required"]
  size_budgets_net_lines: {S: 50, M: 200, L: 500}
  stop_when_over_budget_factor: 1.5
  review_outcomes: ["ACCEPTED", "REQUEST_CHANGES", "REQUEST_SIMPLIFY"]
  evidence_file_caps: {docs: 0, code: 3, compute: 10}
  hash_git_tracked_files: false
workflow:
  supported_modes: ["EXPLORE", "VALIDATE"]
  task_timeout_required: true
  max_self_repair_attempts_per_failure_class: 3
