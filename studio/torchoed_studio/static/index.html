<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>TorchOED Studio</title>
<style>body{font:16px system-ui;max-width:900px;margin:2em auto;padding:1em}input{width:90%}table{width:100%}pre{overflow:auto}button,select{padding:.6em;margin:.5em 0}</style>
<h1>TorchOED Studio</h1><label>Example <select id="example"><option>ChemReact</option><option>Oats</option></select></label>
<table><thead><tr><th>Factor</th><th>Low</th><th>High</th><th>Levels (JSON, for Oats)</th></tr></thead><tbody id="factors"></tbody></table>
<label>Model <select id="model"><option>quadratic</option><option>linear</option></select></label>
<button id="generate">Generate</button> <button id="evaluate" disabled>Evaluate</button> <button id="compare" disabled>Compare</button> <button id="export" disabled>Export CSV</button><pre id="result" aria-live="polite"></pre>
<label>Responses CSV <textarea id="csvdata" rows="6" style="width:100%"></textarea></label>
<label>Response column <input id="responsecol" value="Yield"></label>
<button id="importdata">Import</button> <button id="fitdata" disabled>Fit</button> <button id="profile" disabled>Profile</button>
<script>
let state;
function preset(){const oats=example.value==='Oats';model.value=oats?'linear':'quadratic';factors.replaceChildren();for(const f of oats?[['Variety','','','["Victory","Golden Rain","Marvellous"]'],['nitro','','','[0,0.2,0.4,0.6]']]:[['Time',80,90,''],['Temp',170,180,'']]){const tr=document.createElement('tr');for(const v of f){const td=document.createElement('td'),input=document.createElement('input');input.value=v;td.append(input);tr.append(td)}factors.append(tr)}}
async function post(path,body){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error((await r.json()).error);return r}
example.onchange=()=>{preset();responsecol.value=example.value==='Oats'?'yield':'Yield'};preset();
importdata.onclick=async()=>{try{const fs=[...factors.rows].map(r=>{const [name,low,high,levels]=[...r.querySelectorAll('input')].map(i=>i.value);return levels?{name,levels:JSON.parse(levels)}:{name,low:Number(low),high:Number(high)}});const request={csv:csvdata.value,factors:fs,response:responsecol.value,block:'Block',whole_plot:example.value==='Oats'?['Block','Variety']:null};state={factors:fs,model:example.value==='Oats'?'interaction':model.value,...await(await post('import',request)).json()};result.textContent=JSON.stringify(state,null,2);fitdata.disabled=profile.disabled=false}catch(e){result.textContent=e.message}};
for(const [id,path] of [['fitdata','fit'],['profile','profile']])document.getElementById(id).onclick=async()=>{try{result.textContent=JSON.stringify(await(await post(path,state)).json(),null,2)}catch(e){result.textContent=e.message}};
generate.onclick=async()=>{try{const fs=[...factors.rows].map(r=>{const [name,low,high,levels]=[...r.querySelectorAll('input')].map(i=>i.value);return levels?{name,levels:JSON.parse(levels)}:{name,low:Number(low),high:Number(high)}});const design=example.value==='Oats'?{kind:'split_plot_full_factorial',blocks:6,whole_plot:[fs[0].name],subplot:[fs[1].name]}:{kind:'central_composite',alpha:Math.sqrt(2),center:[3,3]};const request={factors:fs,model:model.value,design};state={...request,...await(await post('generate',request)).json()};result.textContent=JSON.stringify(state,null,2);for(const id of ['evaluate','compare','export'])document.getElementById(id).disabled=false}catch(e){result.textContent=e.message}};
for(const id of ['evaluate','compare'])document.getElementById(id).onclick=async()=>{try{result.textContent=JSON.stringify(await(await post(id,state)).json(),null,2)}catch(e){result.textContent=e.message}};
document.getElementById('export').onclick=async()=>{try{const url=URL.createObjectURL(await(await post('export',state)).blob()),a=document.createElement('a');a.href=url;a.download='design.csv';a.click();URL.revokeObjectURL(url)}catch(e){result.textContent=e.message}};
</script></html>
